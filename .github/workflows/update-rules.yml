name: update-rules

on:
  schedule:
    - cron: "0 21 * * *"        # 每日 UTC 21:00 = 北京时间 05:00
  workflow_dispatch: {}

concurrency:
  group: update-rules
  cancel-in-progress: false

permissions:
  contents: write               # 允许 GITHUB_TOKEN 提交 dist/ 与 upstream/

env:
  # 编译器版本锚定：与本地验证（README 记录）保持一致，保证产物可复现
  SINGBOX_VERSION: "1.14.4"
  MIHOMO_VERSION: "v1.19.34"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          gh release download "v${SINGBOX_VERSION}" --repo SagerNet/sing-box \
            --pattern "sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" --output sb.tgz
          tar xzf sb.tgz
          sudo mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Install mihomo
        run: |
          gh release download "${MIHOMO_VERSION}" --repo MetaCubeX/mihomo \
            --pattern "mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz" --output mh.gz
          gunzip -c mh.gz > mihomo && chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Download upstream category lists (meta-rules-dat, best-effort)
        run: python3 scripts/fetch_upstream.py

      - name: Build dist (json / srs / mrs / regex.list / list)
        run: python3 scripts/build.py

      # 任一步失败即终止 → Commit 步骤不执行 → 失败不发布
      - name: Validate (assertions across json / srs / list / 5B mrs+regex)
        run: python3 scripts/assert.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ upstream/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "自动更新：合并上游类别 $(date -u +%F)"
            git push
          fi
